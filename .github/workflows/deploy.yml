# Builds the site and publishes it to GitHub Pages on every push to main.
# One-time setup: repository Settings → Pages → Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set site URL
        # The site is served at the root of its custom domain (Settings → Pages → Custom domain).
        # A repository variable SITE_URL overrides it.
        run: echo "SITE_URL=${{ vars.SITE_URL || 'https://clario.mahmoudanwari.com' }}" >> "$GITHUB_ENV"

      - run: npm ci

      # `npm run build` runs `astro check` first, so a type error or a missing
      # translation key fails the deploy instead of shipping.
      - run: npm run build

      # Static QA pass over dist/: asserts no trackers, no form actions, no
      # mailto:/tel: links and no misleading structured data, plus baseline
      # SEO, accessibility and translation checks on all 50 pages.
      - run: npm test

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
